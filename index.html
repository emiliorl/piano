<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano AI Practice</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--cyan:#22d3ee;--green:#34d399;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0}
select,button,input[type=text]{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--cyan)}
button.on{background:#0e7490;border-color:var(--cyan)}
.stats{margin-left:auto;display:flex;gap:16px;color:var(--dim)}
.stats b{color:var(--fg)}
#settings{display:none;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);gap:16px;align-items:center;flex-wrap:wrap}
#settings.open{display:flex}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;top:8px;left:12px;color:var(--dim);font-size:12px}
#kb{position:relative;height:150px;background:#000;flex:none;user-select:none;touch-action:none}
.w,.b{position:absolute;top:0;cursor:pointer}
.w{background:#f0f0f0;border:1px solid #222;height:100%;border-radius:0 0 4px 4px}
.b{background:#111;height:60%;z-index:2;border-radius:0 0 3px 3px}
.w.target{background:var(--cyan)}.b.target{background:#0891b2}
.w.key-detected-correct,.b.key-detected-correct{background:var(--green)}
.w.key-detected-wrong,.b.key-detected-wrong{background:var(--red)}
.qk{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:700 12px system-ui;color:#0e7490;pointer-events:none}
.b .qk{bottom:8px;color:#67e8f9}
#heard{position:absolute;top:8px;right:12px;text-align:right;font-size:12px;color:var(--dim);display:none}
#heard b{display:block;font-size:26px;color:var(--fg);line-height:1.1}
#hbar{height:4px;background:var(--cyan);width:0;margin-top:4px;border-radius:2px;margin-left:auto}
.w.heard,.b.heard{box-shadow:inset 0 -10px 0 #f59e0b}
.lbl{position:absolute;bottom:3px;width:100%;text-align:center;font-size:9px;color:#555;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>🎹 Piano AI Practice</h1>
  <select id="song"></select>
  <select id="range">
    <option value="48,72">C3–C5</option>
    <option value="36,84" selected>C2–C6</option>
    <option value="21,108">A0–C8</option>
  </select>
  <select id="mode">
    <option value="wait">Wait for notes</option>
    <option value="tempo">Play at tempo</option>
  </select>
  <button id="start" style="display:none">▶ Start</button>
  <button id="mic">Enable Mic</button>
  <button id="keys" class="on">⌨ Keys</button>
  <button id="restart">Restart</button>
  <button id="import">Import</button>
  <button id="gear">⚙</button>
  <div class="stats">
    <span>Note <b id="pos">0/0</b></span><span>Streak <b id="streak">0</b></span><span>Accuracy <b id="acc">–</b></span>
  </div>
</header>
<div id="settings">
  <label>Mic noise threshold (RMS) <input id="thr" type="range" min="0.002" max="0.1" step="0.001" value="0.01"> <b id="thrv">0.01</b></label>
  <label>Tempo <input id="bpm" type="range" min="30" max="180" step="5" value="70"> <b id="bpmv">70</b> BPM</label>
  <label><input id="sound" type="checkbox" checked> Play sound on keys</label>
  <label><input id="hl" type="checkbox" checked> Highlight next key</label>
  <label><input id="wrongfx" type="checkbox"> Flash wrong notes red</label>
  <span style="color:var(--dim)">QWERTY: A S D F G H J K L ; ' = white, W E T Y U O P = black, Z/X = octave down/up (base C<span id="oct">4</span>)</span>
</div>
<main><canvas id="roll"></canvas><div id="heard">Mic hears<b id="hnote">–</b><div id="hbar"></div></div><div id="status">Click a key, use QWERTY, MIDI or the mic.</div></main>
<div id="kb"></div>

<script>
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const noteName=m=>NAMES[m%12]+(Math.floor(m/12)-1);
function parseNote(s){const r=/^([A-Ga-g])([#b]?)(-?\d)$/.exec(s);if(!r)return null;
  let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1].toUpperCase()];if(r[2]==='#')p++;if(r[2]==='b')p--;
  return (+r[3]+1)*12+p;}
const $=id=>document.getElementById(id);

const SONGS={
 'Ode to Joy':'E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4 D4 D4 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4',
 'Twinkle Twinkle Little Star':'C4 C4 G4 G4 A4 A4 G4 F4 F4 E4 E4 D4 D4 C4 G4 G4 F4 F4 E4 E4 D4 G4 G4 F4 F4 E4 E4 D4 C4 C4 G4 G4 A4 A4 G4 F4 F4 E4 E4 D4 D4 C4',
 'Für Elise':'E5 D#5 E5 D#5 E5 B4 D5 C5 A4 C4 E4 A4 B4 E4 G#4 B4 C5 E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4',
 'Canon in D':'F#5 E5 D5 C#5 B4 A4 B4 C#5 D5 C#5 B4 A4 G4 F#4 G4 E4 F#5 E5 D5 C#5 B4 A4 B4 C#5',
};
let song=[],idx=0,total=0,correct=0,streak=0,range=[36,84];

// ---------- synth ----------
let ac;
function audio(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function synth(m,dur=1.2){
  if(!$('sound').checked)return;
  const c=audio(),f=440*2**((m-69)/12),t=c.currentTime,g=c.createGain();
  g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(c.destination);
  [['triangle',f,1],['sine',f*2,0.4]].forEach(([type,fr,v])=>{
    const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=fr;og.gain.value=v;
    o.connect(og).connect(g);o.start(t);o.stop(t+dur);});
}

// ---------- keyboard ----------
const kb=$('kb'),keyEls={};
function buildKeyboard(){
  kb.innerHTML='';for(const k in keyEls)delete keyEls[k];
  const [lo,hi]=range;let whites=0;
  for(let m=lo;m<=hi;m++)if(!isBlack(m))whites++;
  const ww=100/whites,bw=ww*0.6;let wi=0;
  for(let m=lo;m<=hi;m++){
    const el=document.createElement('div');
    if(!isBlack(m)){el.className='w';el.style.left=wi*ww+'%';el.style.width=ww+'%';
      if(m%12===0){const l=document.createElement('div');l.className='lbl';l.textContent=noteName(m);el.appendChild(l)}wi++;}
    else{el.className='b';el.style.left=(wi*ww-bw/2)+'%';el.style.width=bw+'%';}
    el.dataset.m=m;keyEls[m]=el;kb.appendChild(el);
  }
  markTarget();updateLabels();
}
let showKeys=true;
function updateLabels(){
  for(const m in keyEls){const o=keyEls[m].querySelector('.qk');if(o)o.remove()}
  if(!showKeys)return;
  for(const k in QMAP){
    const el=keyEls[(base+1)*12+QMAP[k]];if(!el)continue;
    const d=document.createElement('div');d.className='qk';d.textContent=k.toUpperCase();el.appendChild(d);
  }
}
// highlight only the single key matching the falling note
function markTarget(){
  for(const m in keyEls)keyEls[m].classList.remove('target');
  const i=targetIdx();
  if(i!=null&&$('hl').checked)keyEls[fit(song[i])]?.classList.add('target');
}
function targetIdx(){
  if(mode==='wait')return idx<song.length?idx:null;
  for(let i=0;i<song.length;i++)if(results[i]==null&&i>=pos-0.5)return i;
  return null;
}
function flash(m,cls){const el=keyEls[m];if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),250)}
kb.addEventListener('pointerdown',e=>{const m=e.target.dataset?.m;if(m!=null)input(+m,'click')});

// ---------- wait mode ----------
let lastMatch=0,mode='wait',results=[],running=false,t0=0,pos=0,lastTarget=null;
function wrong(m){streak=0;if($('wrongfx').checked)flash(m,'key-detected-wrong')}
function input(m,src){
  // mic/MIDI input comes from a real instrument, so don't echo it through the synth
  if(src==='click'||src==='qwerty')synth(m,0.8);
  const now=performance.now();
  if(mode==='wait'){
    if(idx>=song.length)return;
    if(src==='mic'&&now-lastMatch<300)return;
    total++;
    if(m%12===song[idx]%12){
      results[idx]='hit';correct++;streak++;idx++;lastMatch=now;flash(m,'key-detected-correct');
      if(idx>=song.length)$('status').textContent='🎉 Song complete!';
    }else wrong(m);
  }else{
    if(!running)return;
    let best=-1;
    for(let i=0;i<song.length;i++)
      if(results[i]==null&&Math.abs(pos-i)<=0.5&&song[i]%12===m%12&&(best<0||Math.abs(pos-i)<Math.abs(pos-best)))best=i;
    total++;
    if(best>=0){results[best]='hit';correct++;streak++;flash(m,'key-detected-correct')}
    else wrong(m);
  }
  markTarget();updateStats();
}
function updateStats(){
  $('pos').textContent=(mode==='wait'?idx:correct)+'/'+song.length;$('streak').textContent=streak;
  $('acc').textContent=total?Math.round(100*correct/total)+'%':'–';
}
function loadSong(seq){
  song=seq;idx=0;total=correct=streak=0;results=[];running=false;
  pos=mode==='tempo'?-2:0;
  $('start').textContent='▶ Start';
  $('status').textContent=mode==='wait'?'Play the highlighted note.':'Press Start, then play each note as it reaches the line.';
  markTarget();updateStats();
}
const beatMs=()=>60000/+$('bpm').value;
function tempoTick(){
  if(!running)return;
  pos=(performance.now()-t0)/beatMs();
  for(let i=0;i<song.length;i++)
    if(results[i]==null&&pos>i+0.5){results[i]='miss';streak=0;total++;updateStats()}
  if(pos>song.length+0.5){
    running=false;$('start').textContent='▶ Start';
    const hits=results.filter(r=>r==='hit').length;
    $('status').textContent=`Finished: ${hits} of ${song.length} notes played on time, ${song.length-hits} missed.`;
  }
}

// ---------- canvas roll ----------
const cv=$('roll'),cx=cv.getContext('2d');
const GAP=70,NH=44;
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(cv.parentElement); // also fires when the settings bar opens/closes
function xOf(m,w){ // match keyboard geometry
  const [lo,hi]=range;let whites=0,wi=0;
  for(let k=lo;k<=hi;k++)if(!isBlack(k))whites++;
  const ww=w/whites;let pos=null;
  for(let k=lo;k<=hi;k++){
    if(!isBlack(k)){if(k===m)pos=wi*ww+ww/2;wi++}
    else if(k===m)pos=wi*ww;
  }
  return {x:pos,ww};
}
function draw(t){
  const w=cv.clientWidth,h=cv.clientHeight,base=h-30;
  cx.clearRect(0,0,w,h);
  if(mode==='wait')pos+=(idx-pos)*0.15;else tempoTick();
  const tg=targetIdx();if(tg!==lastTarget){lastTarget=tg;markTarget()}
  // hit line
  cx.strokeStyle='#22d3ee55';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,base);cx.lineTo(w,base);cx.stroke();
  for(let i=0;i<song.length;i++){
    const m=fit(song[i]);const {x,ww}=xOf(m,w);if(x==null)continue;
    const y=base-(i-pos)*GAP;if(y<-NH)break;
    // notes that have passed the line fade out instead of piling up
    const past=pos-i,alpha=past>0.3?1-(past-0.3)*1.2:1;if(alpha<=0)continue;
    const res=results[i],active=i===tg,col=res==='hit'?'#34d399':res==='miss'?'#f87171':'#22d3ee';
    const pw=Math.max(ww*0.9,14);
    cx.globalAlpha=alpha;
    cx.beginPath();cx.roundRect(x-pw/2,y-NH,pw,NH,8);
    cx.fillStyle=col+(res?'44':active?'55':'22');cx.fill();
    cx.strokeStyle=col;cx.lineWidth=active?3:1.5;
    if(active){cx.shadowColor=col;cx.shadowBlur=14+6*Math.sin(t/200)}
    cx.stroke();cx.shadowBlur=0;
    if(pw>20){cx.fillStyle='#e6edf3';cx.font='11px system-ui';cx.textAlign='center';cx.fillText(NAMES[song[i]%12],x,y-NH/2+4)}
    cx.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}
// transpose octaves so notes fall inside the visible keyboard range
function fit(m){while(m<range[0])m+=12;while(m>range[1])m-=12;return m}

// ---------- QWERTY ----------
const QMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16,"'":17};
let base=4;
addEventListener('keydown',e=>{
  if(e.repeat||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(k==='z'){base=Math.max(1,base-1);$('oct').textContent=base;updateLabels();return}
  if(k==='x'){base=Math.min(7,base+1);$('oct').textContent=base;updateLabels();return}
  if(k in QMAP)input((base+1)*12+QMAP[k],'qwerty');
});

// ---------- MIDI ----------
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{
  const hook=i=>i.onmidimessage=e=>{const [s,n,v]=e.data;if((s&0xf0)===0x90&&v>0)input(n,'midi')};
  a.inputs.forEach(hook);a.onstatechange=()=>a.inputs.forEach(hook);
}).catch(()=>{});

// ---------- mic pitch detection ----------
let analyser,buf,micOn=false,cand=null,candN=0,prevRms=0,lastMicMidi=-1;
async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=audio(),src=c.createMediaStreamSource(s);
    analyser=c.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);
    micOn=true;$('mic').classList.add('on');$('mic').textContent='Mic On';$('status').textContent='Listening…';
    micLoop();
  }catch(err){$('status').textContent='Microphone unavailable: '+err.message}
}
function detect(b,sr){
  const N=b.length;let sum=0;for(let i=0;i<N;i++)sum+=b[i]*b[i];
  const rms=Math.sqrt(sum/N);if(rms<+$('thr').value)return {rms};
  const minTau=Math.floor(sr/2100),maxTau=Math.min(Math.floor(sr/60),N/2|0),W=N-maxTau;
  const nsdf=new Float32Array(maxTau+1);
  let e0=0;for(let j=0;j<W;j++)e0+=b[j]*b[j];
  let eT=0;for(let j=0;j<W;j++)eT+=b[j+minTau-1]*b[j+minTau-1];
  for(let tau=minTau;tau<=maxTau;tau++){
    let ac=0;for(let j=0;j<W;j++)ac+=b[j]*b[j+tau];
    eT+=b[W-1+tau]*b[W-1+tau]-b[tau-1]*b[tau-1]; // slide window energy
    nsdf[tau]=ac/(Math.sqrt(e0*Math.max(eT,0))+1e-9);
  }
  // key maxima between zero crossings
  const peaks=[];let tau=minTau;
  while(tau<maxTau&&nsdf[tau]>0)tau++;
  while(tau<maxTau){
    while(tau<maxTau&&nsdf[tau]<=0)tau++;
    let best=-1;
    while(tau<maxTau&&nsdf[tau]>0){if(best<0||nsdf[tau]>nsdf[best])best=tau;tau++}
    if(best>0)peaks.push(best);
  }
  if(!peaks.length)return {rms};
  const mx=Math.max(...peaks.map(p=>nsdf[p]));
  const p=peaks.find(p=>nsdf[p]>=0.85*mx);
  if(nsdf[p]<0.5)return {rms};
  const y1=nsdf[p-1],y2=nsdf[p],y3=nsdf[p+1],d=(y3-y1)/(2*(2*y2-y1-y3)||1e-9);
  const f=sr/(p+d);
  return {rms,midi:Math.round(69+12*Math.log2(f/440))};
}
// live readout of what the mic detects, plus an amber marker on the matching key
let heardEl=null;
function showHeard(r){
  $('heard').style.display='block';
  const ok=r.midi!=null&&r.midi>=21&&r.midi<=108;
  $('hnote').textContent=ok?noteName(r.midi):'–';
  $('hbar').style.width=Math.min(100,(r.rms||0)*600)+'px';
  const el=ok?keyEls[r.midi]:null;
  if(el!==heardEl){heardEl?.classList.remove('heard');el?.classList.add('heard');heardEl=el}
}
function micLoop(){
  if(!micOn)return;
  analyser.getFloatTimeDomainData(buf);
  const r=detect(buf,ac.sampleRate);
  showHeard(r);
  if(r.midi!=null&&r.midi>=21&&r.midi<=108){
    if(r.midi===cand)candN++;else{cand=r.midi;candN=1}
    const onset=r.rms>prevRms*1.25||r.midi!==lastMicMidi;
    if(candN>=2&&onset){lastMicMidi=r.midi;candN=0;input(r.midi,'mic')}
  }else{cand=null;candN=0;if(!r.rms||r.rms<+$('thr').value)lastMicMidi=-1}
  prevRms=r.rms||0;
  setTimeout(micLoop,20);
}

// ---------- UI wiring ----------
for(const n in SONGS){const o=document.createElement('option');o.textContent=n;$('song').appendChild(o)}
const seqOf=s=>s.trim().split(/[\s,]+/).map(parseNote).filter(n=>n!=null);
$('song').onchange=()=>loadSong(seqOf(SONGS[$('song').value]));
$('range').onchange=()=>{range=$('range').value.split(',').map(Number);buildKeyboard()};
$('restart').onclick=()=>loadSong(song);
$('mic').onclick=()=>{audio();if(!micOn)startMic()};
$('gear').onclick=()=>$('settings').classList.toggle('open');
$('mode').onchange=()=>{mode=$('mode').value;$('start').style.display=mode==='tempo'?'':'none';loadSong(song)};
$('start').onclick=()=>{
  audio();
  if(running){running=false;$('start').textContent='▶ Resume';return}
  if(pos>song.length||results.every(r=>r!=null)&&song.length)loadSong(song);
  t0=performance.now()-pos*beatMs();running=true;$('start').textContent='⏸ Pause';
  $('status').textContent='Play each note as it reaches the line.';
};
$('keys').onclick=()=>{showKeys=!showKeys;$('keys').classList.toggle('on',showKeys);updateLabels()};
$('hl').onchange=markTarget;
$('bpm').oninput=()=>{
  $('bpmv').textContent=$('bpm').value;
  if(running)t0=performance.now()-pos*beatMs(); // keep position when tempo changes
};
$('thr').oninput=()=>$('thrv').textContent=$('thr').value;
$('import').onclick=()=>{
  const s=prompt('Enter notes (e.g. C4 D4 E4 F#4 G4):');if(!s)return;
  const q=seqOf(s);if(!q.length)return alert('No valid notes found.');
  SONGS['Custom']=s;if(![...$('song').options].some(o=>o.text==='Custom')){const o=document.createElement('option');o.textContent='Custom';$('song').appendChild(o)}
  $('song').value='Custom';loadSong(q);
};

resize();buildKeyboard();loadSong(seqOf(SONGS['Ode to Joy']));requestAnimationFrame(draw);
</script>
</body>
</html>
